<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>Promptly — Act. Draw. Guess.</title>
    <meta
      name="description"
      content="Promptly is a collection of in-person party games built around word prompts. Charades, Forehead and Draw &amp; Guess on one phone."
    />
    <meta name="theme-color" content="#0E0E11" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Promptly" />

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/game.css" />
  </head>

  <body>
    <main id="app" class="app"></main>

    <!--
      Outside #app on purpose: js/ui/render.js replaces that element's
      innerHTML on every commit, so a counter nested inside would be destroyed
      on the next redraw.
    -->
    <p class="visitor-counter" hidden>
      <span id="visitor-count" class="visitor-count">—</span> visitors
    </p>

    <div id="live" class="sr-only" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">
        <h1>promptly</h1>
        <p>Promptly needs JavaScript enabled to keep score and run the round timer.</p>
      </div>
    </noscript>

    <script type="module" src="./js/main.js"></script>

    <!--
      Cross-origin on purpose, and deliberately absent from the service
      worker's precache: a beacon answered from cache records nothing.
      sw.js lets unknown cross-origin hosts fall through to the network
      untouched, so offline loads simply go uncounted.
    -->
    <script
      data-goatcounter="https://yvj.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
